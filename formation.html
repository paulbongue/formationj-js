estBloque) { }                  // négation\n```\n\nCombine avec des parenthèses dès que tu mélanges `&&` et `||` :\n\n```js\nif ((a || b) && c) { }    // sans ambiguïté\n```\n\n## Nommer ses conditions\n\nUne condition longue devient lisible en la nommant :\n\n```js\n// avant\nif (u.age >= 18 && u.actif && !u.banni && u.emailVerifie) { }\n\n// après\nconst peutCommander = u.age >= 18 && u.actif && !u.banni && u.emailVerifie;\nif (peutCommander) { }\n```\n\n## À retenir\n\n- Early return plutôt qu'imbrication : les cas d'exclusion d'abord.\n- Le ternaire choisit une valeur, il n'orchestre pas des actions.\n- `switch` compare en `===` et « tombe » dans le cas suivant sans `break`.\n- Une condition complexe mérite un nom.\n","dossier":"02-07-conditions","enonce":"\n# Exercice 02-07\n\n## 1. `mention(note)`\n\nNote sur 20 → mention.\n\n| Note | Renvoie |\n|---|---|\n| ≥ 16 | `\"très bien\"` |\n| ≥ 14 | `\"bien\"` |\n| ≥ 12 | `\"assez bien\"` |\n| ≥ 10 | `\"passable\"` |\n| < 10 | `\"insuffisant\"` |\n\nUne note hors de l'intervalle 0–20, ou pas un nombre, renvoie `\"note invalide\"`.\n\n## 2. `droitsDe(role)`\n\nAvec un `switch` :\n\n- `\"admin\"` → `\"tous les droits\"`\n- `\"editeur\"` et `\"auteur\"` → `\"peut publier\"`\n- `\"abonne\"` → `\"peut commenter\"`\n- tout le reste → `\"lecture seule\"`\n\n## 3. `peutCommander(utilisateur)`\n\nRenvoie un objet `{ autorise, raison }`. La **première** règle qui échoue donne la raison. Ordre imposé :\n\n1. pas d'utilisateur → `\"aucun utilisateur\"`\n2. `banni` vrai → `\"compte banni\"`\n3. `actif` faux → `\"compte inactif\"`\n4. `age` < 18 → `\"mineur\"`\n5. `emailVerifie` faux → `\"email non vérifié\"`\n6. tout va bien → `{ autorise: true, raison: null }`\n\nÉcris-la en **early return**, pas en if imbriqués.\n\n## 4. `estBissextile(annee)`\n\nDivisible par 4, sauf les multiples de 100 qui ne sont pas multiples de 400.\n`2024` → `true`, `1900` → `false`, `2000` → `true`.\n\n## 5. `categorieImc(poids, taille)`\n\nIMC = poids / taille². Renvoie `\"insuffisance\"` (< 18,5), `\"normal\"` (< 25), `\"surpoids\"` (< 30), `\"obésité\"` (≥ 30). Taille nulle ou négative → `null`.\n\n## Corriger\n\n```\njs 02-07\n```\n","depart":"\n// Exercice 02-07 · Conditions\n\nexport function mention(note) {\n  // TODO\n}\n\nexport function droitsDe(role) {\n  // TODO : utilise un switch\n}\n\nexport function peutCommander(utilisateur) {\n  // TODO : early return, dans l'ordre imposé par l'énoncé\n}\n\nexport function estBissextile(annee) {\n  // TODO\n}\n\nexport function categorieImc(poids, taille) {\n  // TODO\n}\n","tests":"\nimport { test, groupe, verifier } from \"../../moteur/verif.mjs\";\nimport * as ex from \"./exercice.mjs\";\n\ngroupe(\"mention\", () => {\n  test(\"chaque palier\", () => {\n    verifier(ex.mention(18)).vaut(\"très bien\");\n    verifier(ex.mention(16)).vaut(\"très bien\");\n    verifier(ex.mention(15)).vaut(\"bien\");\n    verifier(ex.mention(14)).vaut(\"bien\");\n    verifier(ex.mention(12)).vaut(\"assez bien\");\n    verifier(ex.mention(10)).vaut(\"passable\");\n    verifier(ex.mention(9.5)).vaut(\"insuffisant\");\n    verifier(ex.mention(0)).vaut(\"insuffisant\");\n  });\n  test(\"bornes exactes\", () => {\n    verifier(ex.mention(20)).vaut(\"très bien\");\n    verifier(ex.mention(13.99)).vaut(\"assez bien\");\n  });\n  test(\"entrées invalides\", () => {\n    verifier(ex.mention(21)).vaut(\"note invalide\");\n    verifier(ex.mention(-1)).vaut(\"note invalide\");\n    verifier(ex.mention(\"12\")).vaut(\"note invalide\");\n    verifier(ex.mention(NaN)).vaut(\"note invalide\");\n  });\n});\n\ngroupe(\"droitsDe\", () => {\n  test(\"admin\", () => verifier(ex.droitsDe(\"admin\")).vaut(\"tous les droits\"));\n  test(\"editeur et auteur partagent le même cas\", () => {\n    verifier(ex.droitsDe(\"editeur\")).vaut(\"peut publier\");\n    verifier(ex.droitsDe(\"auteur\")).vaut(\"peut publier\");\n  });\n  test(\"abonne\", () => verifier(ex.droitsDe(\"abonne\")).vaut(\"peut commenter\"));\n  test(\"inconnu et vide\", () => {\n    verifier(ex.droitsDe(\"bidule\")).vaut(\"lecture seule\");\n    verifier(ex.droitsDe(undefined)).vaut(\"lecture seule\");\n  });\n  test(\"switch compare en === : pas de tolérance de casse\", () => {\n    verifier(ex.droitsDe(\"ADMIN\")).vaut(\"lecture seule\");\n  });\n});\n\ngroupe(\"peutCommander\", () => {\n  const valide = { actif: true, banni: false, age: 25, emailVerifie: true };\n  test(\"cas valide\", () => {\n    verifier(ex.peutCommander(valide)).vaut({ autorise: true, raison: null });\n  });\n  test(\"aucun utilisateur\", () => {\n    verifier(ex.peutCommander(undefined)).vaut({ autorise: false, raison: \"aucun utilisateur\" });\n    verifier(ex.peutCommander(null)).vaut({ autorise: false, raison: \"aucun utilisateur\" });\n  });\n  test(\"banni prime sur tout le reste\", () => {\n    verifier(ex.peutCommander({ ...valide, banni: true, actif: false, age: 10 }))\n      .vaut({ autorise: false, raison: \"compte banni\" }, \"l'ordre des règles est imposé\");\n  });\n  test(\"inactif\", () => {\n    verifier(ex.peutCommander({ ...valide, actif: false }))\n      .vaut({ autorise: false, raison: \"compte inactif\" });\n  });\n  test(\"mineur\", () => {\n    verifier(ex.peutCommander({ ...valide, age: 17 }))\n      .vaut({ autorise: false, raison: \"mineur\" });\n  });\n  test(\"email non vérifié\", () => {\n    verifier(ex.peutCommander({ ...valide, emailVerifie: false }))\n      .vaut({ autorise: false, raison: \"email non vérifié\" });\n  });\n  test(\"18 ans pile passe\", () => {\n    verifier(ex.peutCommander({ ...valide, age: 18 }).autorise).estVrai();\n  });\n});\n\ngroupe(\"estBissextile\", () => {\n  test(\"multiples de 4\", () => {\n    verifier(ex.estBissextile(2024)).estVrai();\n    verifier(ex.estBissextile(2023)).estFaux();\n  });\n  test(\"siècles non bissextiles\", () => {\n    verifier(ex.estBissextile(1900)).estFaux(\"multiple de 100 sans être multiple de 400\");\n    verifier(ex.estBissextile(2100)).estFaux();\n  });\n  test(\"multiples de 400\", () => {\n    verifier(ex.estBissextile(2000)).estVrai();\n    verifier(ex.estBissextile(1600)).estVrai();\n  });\n});\n\ngroupe(\"categorieImc\", () => {\n  test(\"catégories\", () => {\n    verifier(ex.categorieImc(50, 1.75)).vaut(\"insuffisance\");\n    verifier(ex.categorieImc(70, 1.75)).vaut(\"normal\");\n    verifier(ex.categorieImc(85, 1.75)).vaut(\"surpoids\");\n    verifier(ex.categorieImc(100, 1.75)).vaut(\"obésité\");\n  });\n  test(\"taille invalide\", () => {\n    verifier(ex.categorieImc(70, 0)).vaut(null, \"évite la division par zéro\");\n    verifier(ex.categorieImc(70, -1)).vaut(null);\n  });\n});\n","solution":"export function mention(note) {\n  if (typeof note !== \"number\" || Number.isNaN(note) || note < 0 || note > 20) {\n    return \"note invalide\";\n  }\n  if (note >= 16) return \"très bien\";\n  if (note >= 14) return \"bien\";\n  if (note >= 12) return \"assez bien\";\n  if (note >= 10) return \"passable\";\n  return \"insuffisant\";\n}\n\nexport function droitsDe(role) {\n  switch (role) {\n    case \"admin\":\n      return \"tous les droits\";\n    case \"editeur\":\n    case \"auteur\":\n      return \"peut publier\";\n    case \"abonne\":\n      return \"peut commenter\";\n    default:\n      return \"lecture seule\";\n  }\n}\n\nexport function peutCommander(utilisateur) {\n  if (!utilisateur) return { autorise: false, raison: \"aucun utilisateur\" };\n  if (utilisateur.banni) return { autorise: false, raison: \"compte banni\" };\n  if (!utilisateur.actif) return { autorise: false, raison: \"compte inactif\" };\n  if (utilisateur.age < 18) return { autorise: false, raison: \"mineur\" };\n  if (!utilisateur.emailVerifie) return { autorise: false, raison: \"email non vérifié\" };\n  return { autorise: true, raison: null };\n}\n\nexport function estBissextile(annee) {\n  return annee % 4 === 0 && (annee % 100 !== 0 || annee % 400 === 0);\n}\n\nexport function categorieImc(poids, taille) {\n  if (taille <= 0) return null;\n  const imc = poids / (taille * taille);\n  if (imc < 18.5) return \"insuffisance\";\n  if (imc < 25) return \"normal\";\n  if (imc < 30) return \"surpoids\";\n  return \"obésité\";\n}"},{"code":"02-08","titre":"Boucles","min":60,"pret":true,"lecon":"\n# 02-08 · Boucles\n\n**60 min · après 02-07**\n\n## for classique\n\n```js\nfor (let i = 0; i < 5; i++) {\n  console.log(i);      // 0 1 2 3 4\n}\n```\n\nTrois parties : initialisation, condition de continuation, incrément. Utile quand tu as besoin de l'**index**.\n\nLe piège universel : `<=` au lieu de `<`.\n\n```js\nconst tab = [\"a\", \"b\", \"c\"];\nfor (let i = 0; i <= tab.length; i++) {\n  console.log(tab[i]);    // a, b, c, undefined   ← un tour de trop\n}\n```\n\nUn tableau de longueur 3 a les index 0, 1, 2. La condition est donc `i < tab.length`.\n\n## for…of : le plus lisible\n\nQuand l'index ne t'intéresse pas :\n\n```js\nfor (const fruit of [\"pomme\", \"poire\"]) {\n  console.log(fruit);\n}\n```\n\nFonctionne sur les tableaux, les chaînes, les Map, les Set. À préférer par défaut.\n\n## for…in : pour les objets, et seulement eux\n\n```js\nconst u = { nom: \"Black\", age: 20 };\nfor (const cle in u) {\n  console.log(cle, u[cle]);\n}\n```\n\nNe l'utilise pas sur un tableau : il itère les **clés** sous forme de chaînes et peut inclure des propriétés héritées.\n\n## while\n\nQuand tu ne sais pas d'avance combien de tours :\n\n```js\nlet n = 100;\nlet etapes = 0;\nwhile (n > 1) {\n  n = n % 2 === 0 ? n / 2 : n * 3 + 1;\n  etapes++;\n}\n```\n\nAssure-toi que la condition finira par devenir fausse. Une boucle infinie gèle le programme — `Ctrl+C` dans le terminal pour en sortir.\n\n`do…while` exécute au moins une fois avant de tester : rare, mais utile pour redemander une saisie.\n\n## break et continue\n\n```js\nfor (const n of nombres) {\n  if (n < 0) continue;    // passe au tour suivant\n  if (n > 100) break;     // sort de la boucle\n  total += n;\n}\n```\n\n## Boucles imbriquées\n\n```js\nfor (let i = 1; i <= 3; i++) {\n  for (let j = 1; j <= 3; j++) {\n    console.log(`${i} x ${j} = ${i * j}`);\n  }\n}\n```\n\nDeux boucles imbriquées sur *n* éléments font *n²* tours. Sur 1 000 éléments, c'est un million d'opérations : réfléchis avant d'imbriquer.\n\n## Accumuler un résultat\n\nLe motif de base, que les méthodes du chapitre 05 remplaceront élégamment :\n\n```js\nconst nombres = [3, 7, 2];\nlet total = 0;                       // l'accumulateur\nfor (const n of nombres) total += n;\n// total === 12\n```\n\nPour construire un tableau :\n\n```js\nconst resultat = [];\nfor (const n of nombres) resultat.push(n * 2);\n// [6, 14, 4]\n```\n\n## À retenir\n\n- `i < longueur`, jamais `<=`.\n- `for…of` par défaut, `for` classique quand tu as besoin de l'index, `for…in` uniquement sur les objets.\n- `while` quand le nombre de tours est inconnu ; vérifie la condition de sortie.\n- `continue` saute un tour, `break` quitte la boucle.\n- Accumulateur déclaré **avant** la boucle, rempli **dedans**.\n","dossier":"02-08-boucles","enonce":"\n# Exercice 02-08\n\n## 1. `fizzbuzz(n)`\n\nRenvoie un **tableau** de 1 à `n` où : les multiples de 3 deviennent `\"Fizz\"`, ceux de 5 `\"Buzz\"`, ceux de 15 `\"FizzBuzz\"`. Les autres restent des **nombres**.\n\n```js\nfizzbuzz(5)   // [1, 2, \"Fizz\", 4, \"Buzz\"]\n```\n\n## 2. `sommePairs(n)`\n\nSomme des nombres pairs de 1 à `n` inclus. `sommePairs(10)` → `30`.\n\n## 3. `tableMultiplication(n)`\n\nTableau de 10 chaînes : `\"3 x 1 = 3\"` … `\"3 x 10 = 30\"`.\n\n## 4. `inverser(chaine)`\n\n`\"bonjour\"` → `\"ruojnob\"`. Avec une boucle, sans `split().reverse().join()`.\n\n## 5. `estPremier(n)`\n\n`true` si `n` est premier. `1` et les nombres < 1 ne sont pas premiers. Arrête la boucle dès que possible — inutile de tester au-delà de la racine carrée.\n\n## 6. `chercherPremierNegatif(nombres)`\n\nRenvoie le **premier** nombre négatif du tableau, ou `null`. Utilise `break` : ne parcours pas la suite pour rien.\n\n## 7. `pyramide(hauteur)`\n\nRenvoie un tableau de chaînes formant une pyramide d'étoiles centrée.\n\n```js\npyramide(3)\n// [\"  *  \",\n//  \" *** \",\n//  \"*****\"]\n```\n\nChaque ligne a la même longueur : `hauteur * 2 - 1`.\n\n## Corriger\n\n```\njs 02-08\n```\n","depart":"\n// Exercice 02-08 · Boucles\n\nexport function fizzbuzz(n) {\n  // TODO\n}\n\nexport function sommePairs(n) {\n  // TODO\n}\n\nexport function tableMultiplication(n) {\n  // TODO\n}\n\nexport function inverser(chaine) {\n  // TODO : avec une boucle\n}\n\nexport function estPremier(n) {\n  // TODO\n}\n\nexport function chercherPremierNegatif(nombres) {\n  // TODO : utilise break\n}\n\nexport function pyramide(hauteur) {\n  // TODO\n}\n","tests":"\nimport { test, groupe, verifier } from \"../../moteur/verif.mjs\";\nimport * as ex from \"./exercice.mjs\";\n\ngroupe(\"fizzbuzz\", () => {\n  test(\"cas de l'énoncé\", () => {\n    verifier(ex.fizzbuzz(5)).vaut([1, 2, \"Fizz\", 4, \"Buzz\"]);\n  });\n  test(\"le multiple de 15 donne FizzBuzz\", () => {\n    verifier(ex.fizzbuzz(15).at(-1)).vaut(\"FizzBuzz\", \"teste 15 AVANT 3 et 5\");\n  });\n  test(\"longueur correcte\", () => verifier(ex.fizzbuzz(20)).aPourLongueur(20));\n  test(\"les non-multiples restent des nombres\", () => {\n    verifier(ex.fizzbuzz(4).at(0)).estDuType(\"number\", \"1 doit rester le nombre 1, pas \\\"1\\\"\");\n  });\n  test(\"n = 0 donne un tableau vide\", () => verifier(ex.fizzbuzz(0)).aPourLongueur(0));\n});\n\ngroupe(\"sommePairs\", () => {\n  test(\"jusqu'à 10\", () => verifier(ex.sommePairs(10)).vaut(30));\n  test(\"borne impaire\", () => verifier(ex.sommePairs(9)).vaut(20));\n  test(\"petites valeurs\", () => {\n    verifier(ex.sommePairs(1)).vaut(0);\n    verifier(ex.sommePairs(2)).vaut(2);\n  });\n});\n\ngroupe(\"tableMultiplication\", () => {\n  test(\"10 lignes\", () => verifier(ex.tableMultiplication(3)).aPourLongueur(10));\n  test(\"format exact\", () => {\n    const t = ex.tableMultiplication(3);\n    verifier(t.at(0)).vaut(\"3 x 1 = 3\");\n    verifier(t.at(9)).vaut(\"3 x 10 = 30\");\n  });\n});\n\ngroupe(\"inverser\", () => {\n  test(\"mot simple\", () => verifier(ex.inverser(\"bonjour\")).vaut(\"ruojnob\"));\n  test(\"chaîne vide\", () => verifier(ex.inverser(\"\")).vaut(\"\"));\n  test(\"un caractère\", () => verifier(ex.inverser(\"a\")).vaut(\"a\"));\n  test(\"palindrome\", () => verifier(ex.inverser(\"kayak\")).vaut(\"kayak\"));\n});\n\ngroupe(\"estPremier\", () => {\n  test(\"premiers\", () => {\n    for (const n of [2, 3, 5, 7, 11, 13, 97]) {\n      if (!ex.estPremier(n)) throw new Error(n + \" est premier\");\n    }\n  });\n  test(\"non premiers\", () => {\n    for (const n of [4, 9, 15, 100]) {\n      if (ex.estPremier(n)) throw new Error(n + \" n'est pas premier\");\n    }\n  });\n  test(\"cas limites\", () => {\n    verifier(ex.estPremier(1)).estFaux(\"1 n'est pas premier\");\n    verifier(ex.estPremier(0)).estFaux();\n    verifier(ex.estPremier(-7)).estFaux();\n    verifier(ex.estPremier(2)).estVrai(\"2 est le premier nombre premier\");\n  });\n});\n\ngroupe(\"chercherPremierNegatif\", () => {\n  test(\"trouve le premier\", () => {\n    verifier(ex.chercherPremierNegatif([3, 7, -2, -9])).vaut(-2);\n  });\n  test(\"aucun négatif\", () => verifier(ex.chercherPremierNegatif([1, 2])).vaut(null));\n  test(\"tableau vide\", () => verifier(ex.chercherPremierNegatif([])).vaut(null));\n  test(\"zéro n'est pas négatif\", () => verifier(ex.chercherPremierNegatif([0, -1])).vaut(-1));\n});\n\ngroupe(\"pyramide\", () => {\n  test(\"hauteur 3\", () => {\n    verifier(ex.pyramide(3)).vaut([\"  *  \", \" *** \", \"*****\"]);\n  });\n  test(\"hauteur 1\", () => verifier(ex.pyramide(1)).vaut([\"*\"]));\n  test(\"toutes les lignes ont la même longueur\", () => {\n    const p = ex.pyramide(5);\n    for (const l of p) verifier(l).aPourLongueur(9);\n  });\n});\n","solution":"export function fizzbuzz(n) {\n  const resultat = [];\n  for (let i = 1; i <= n; i++) {\n    if (i % 15 === 0) resultat.push(\"FizzBuzz\");        // 15 en premier !\n    else if (i % 3 === 0) resultat.push(\"Fizz\");\n    else if (i % 5 === 0) resultat.push(\"Buzz\");\n    else resultat.push(i);\n  }\n  return resultat;\n}\n\nexport function sommePairs(n) {\n  let total = 0;\n  for (let i = 1; i <= n; i++) {\n    if (i % 2 === 0) total += i;\n  }\n  return total;\n}\n\nexport function tableMultiplication(n) {\n  const lignes = [];\n  for (let i = 1; i <= 10; i++) {\n    lignes.push(`${n} x ${i} = ${n * i}`);\n  }\n  return lignes;\n}\n\nexport function inverser(chaine) {\n  let resultat = \"\";\n  for (let i = chaine.length - 1; i >= 0; i--) {\n    resultat += chaine[i];\n  }\n  return resultat;\n}\n\nexport function estPremier(n) {\n  if (!Number.isInteger(n) || n < 2) return false;\n  for (let d = 2; d * d <= n; d++) {      // s'arrête à la racine carrée\n    if (n % d === 0) return false;\n  }\n  return true;\n}\n\nexport function chercherPremierNegatif(nombres) {\n  let trouve = null;\n  for (const n of nombres) {\n    if (n < 0) {\n      trouve = n;\n      break;                              // inutile de continuer\n    }\n  }\n  return trouve;\n}\n\nexport function pyramide(hauteur) {\n  const largeur = hauteur * 2 - 1;\n  const lignes = [];\n  for (let i = 1; i <= hauteur; i++) {\n    const etoiles = i * 2 - 1;\n    const espaces = (largeur - etoiles) / 2;\n    lignes.push(\" \".repeat(espaces) + \"*\".repeat(etoiles) + \" \".repeat(espaces));\n  }\n  return lignes;\n}"},{"code":"02-09","titre":"Projet : quiz en console","min":120,"pret":true,"lecon":"\n# 02-09 · Projet : quiz en console\n\n**2 h · après 02-08 · premier vrai projet**\n\nCe module ne t'apprend pas de nouvelle notion. Il te fait assembler tout le chapitre 2 dans un programme complet : variables, chaînes, nombres, conditions, boucles.\n\n## Ce que tu construis\n\nUn moteur de quiz. Deux parties :\n\n1. **La logique** (testée automatiquement) : une fonction `creerQuiz` qui gère les questions, les réponses, le score.\n2. **L'interface console** (libre) : un vrai jeu jouable dans le terminal, qui utilise ta logique.\n\nCette séparation entre **logique** et **interface** est un des principes les plus importants du métier. La logique ne sait pas qu'elle est affichée dans un terminal ; demain tu brancheras la même logique sur une page web sans y toucher une ligne.\n\n## Le motif « objet avec état »\n\nTu n'as pas encore vu les classes. Pas besoin : une fonction qui renvoie un objet de fonctions suffit, et c'est même le style le plus courant en JavaScript moderne.\n\n```js\nfunction creerCompteur() {\n  let valeur = 0;                       // l'état, invisible de l'extérieur\n\n  return {\n    incrementer() { valeur++; return valeur; },\n    valeur() { return valeur; }\n  };\n}\n\nconst c = creerCompteur();\nc.incrementer();      // 1\nc.valeur();           // 1\nc.valeur = 999;       // ne casse rien : l'état interne est protégé\n```\n\nL'état vit dans la fonction, les méthodes renvoyées y accèdent. C'est une **closure**, que tu étudieras formellement en 03-06. Tu l'utilises déjà.\n\n## Lire une saisie dans le terminal\n\nNode fournit un module intégré. Pour la partie interface :\n\n```js\nimport readline from \"node:readline/promises\";\n\nconst rl = readline.createInterface({ input: process.stdin, output: process.stdout });\nconst reponse = await rl.question(\"Ta réponse ? \");\nconsole.log(\"Tu as répondu :\", reponse);\nrl.close();\n```\n\nLe `await` fonctionne directement au niveau supérieur d'un fichier `.mjs`. Tu comprendras pourquoi en section 08 ; pour l'instant, retiens la formule.\n\n## Conseils de méthode\n\n- **Écris la logique d'abord**, fais passer les tests, et seulement ensuite l'interface. C'est l'ordre naturel : on ne décore pas une maison sans murs.\n- Une fonction = une responsabilité. Si une fonction fait plus de 15 lignes, elle en fait probablement deux.\n- Commite après chaque fonction qui passe ses tests.\n\n## À retenir\n\n- Une fonction qui renvoie un objet de méthodes = de l'état encapsulé, sans classe.\n- Sépare toujours la logique de l'affichage.\n- La logique se teste, l'interface se voit. Les deux se développent séparément.\n","dossier":"02-09-projet-quiz-en-console","enonce":"\n# Exercice 02-09 · Projet quiz\n\n## Partie testée : `creerQuiz(questions)`\n\n`questions` est un tableau d'objets :\n\n```js\n[\n  { enonce: \"Capitale de la France ?\", reponse: \"paris\", points: 1 },\n  { enonce: \"2 + 2 ?\", reponse: \"4\", points: 2 }\n]\n```\n\n`creerQuiz` renvoie un objet avec exactement ces méthodes :\n\n### `questionCourante()`\nL'objet question en cours, ou `null` si le quiz est terminé.\n\n### `repondre(saisie)`\nCompare la saisie à la réponse attendue, **sans tenir compte de la casse ni des espaces autour**. Puis avance à la question suivante.\n\nRenvoie `{ correct, attendu, points }` :\n- `correct` : booléen\n- `attendu` : la réponse attendue\n- `points` : points gagnés sur cette question (0 si faux)\n\nSi le quiz est déjà terminé, renvoie `null` sans rien modifier.\n\n### `score()`\n`{ points, maximum, bonnes, total }`.\n\n### `termine()`\n`true` quand toutes les questions ont été posées.\n\n### `bilan()`\nUne chaîne selon le pourcentage de points obtenus :\n\n| Pourcentage | Bilan |\n|---|---|\n| 100 | `\"parfait\"` |\n| ≥ 75 | `\"très bien\"` |\n| ≥ 50 | `\"correct\"` |\n| ≥ 25 | `\"à revoir\"` |\n| < 25 | `\"il faut relire la leçon\"` |\n\nUn quiz sans question renvoie `\"il faut relire la leçon\"` et un score de 0.\n\n### `progression()`\nChaîne `\"2/5\"` : nombre de questions déjà posées sur le total.\n\n## Partie libre : le jeu\n\nCrée un fichier `jeu.mjs` **dans le même dossier**, qui importe `creerQuiz` et propose une vraie partie dans le terminal : affichage de la question, saisie, correction immédiate, score final et bilan.\n\n```\nnode jeu.mjs\n```\n\nCette partie n'est pas testée automatiquement — je la relirai au bilan hebdomadaire.\n\n## Corriger\n\n```\njs 02-09\n```\n","depart":"\n// Exercice 02-09 · Projet quiz — la logique\n// L'interface va dans un fichier jeu.mjs séparé.\n\nexport function creerQuiz(questions) {\n  // TODO : déclare ici l'état (index courant, points, bonnes réponses)\n\n  return {\n    questionCourante() {\n      // TODO\n    },\n    repondre(saisie) {\n      // TODO : { correct, attendu, points } ou null si terminé\n    },\n    score() {\n      // TODO : { points, maximum, bonnes, total }\n    },\n    termine() {\n      // TODO\n    },\n    bilan() {\n      // TODO\n    },\n    progression() {\n      // TODO : \"2/5\"\n    }\n  };\n}\n","tests":"\nimport { test, groupe, verifier } from \"../../moteur/verif.mjs\";\nimport { creerQuiz } from \"./exercice.mjs\";\n\nconst QUESTIONS = [\n  { enonce: \"Capitale de la France ?\", reponse: \"paris\", points: 1 },\n  { enonce: \"2 + 2 ?\", reponse: \"4\", points: 2 },\n  { enonce: \"Type de []\", reponse: \"object\", points: 1 }\n];\nconst neuf = () => creerQuiz(QUESTIONS.map(q => ({ ...q })));\n\ngroupe(\"structure\", () => {\n  test(\"creerQuiz est exportée\", () => verifier(creerQuiz).estUneFonction());\n  test(\"toutes les méthodes existent\", () => {\n    const q = neuf();\n    for (const m of [\"questionCourante\", \"repondre\", \"score\", \"termine\", \"bilan\", \"progression\"]) {\n      verifier(q[m]).estUneFonction(\"méthode manquante : \" + m);\n    }\n  });\n});\n\ngroupe(\"questionCourante\", () => {\n  test(\"commence à la première\", () => {\n    verifier(neuf().questionCourante().enonce).vaut(\"Capitale de la France ?\");\n  });\n  test(\"avance après une réponse\", () => {\n    const q = neuf();\n    q.repondre(\"paris\");\n    verifier(q.questionCourante().enonce).vaut(\"2 + 2 ?\");\n  });\n  test(\"null à la fin\", () => {\n    const q = neuf();\n    q.repondre(\"a\"); q.repondre(\"b\"); q.repondre(\"c\");\n    verifier(q.questionCourante()).vaut(null);\n  });\n});\n\ngroupe(\"repondre\", () => {\n  test(\"bonne réponse\", () => {\n    verifier(neuf().repondre(\"paris\")).vaut({ correct: true, attendu: \"paris\", points: 1 });\n  });\n  test(\"mauvaise réponse : 0 point\", () => {\n    verifier(neuf().repondre(\"lyon\")).vaut({ correct: false, attendu: \"paris\", points: 0 });\n  });\n  test(\"insensible à la casse\", () => {\n    verifier(neuf().repondre(\"PARIS\").correct).estVrai();\n    verifier(neuf().repondre(\"Paris\").correct).estVrai();\n  });\n  test(\"ignore les espaces autour\", () => {\n    verifier(neuf().repondre(\"  paris  \").correct).estVrai();\n  });\n  test(\"renvoie les points de la question\", () => {\n    const q = neuf();\n    q.repondre(\"paris\");\n    verifier(q.repondre(\"4\").points).vaut(2);\n  });\n  test(\"null quand le quiz est terminé\", () => {\n    const q = neuf();\n    q.repondre(\"a\"); q.repondre(\"b\"); q.repondre(\"c\");\n    verifier(q.repondre(\"d\")).vaut(null, \"ne doit rien modifier après la fin\");\n  });\n});\n\ngroupe(\"score\", () => {\n  test(\"score initial\", () => {\n    verifier(neuf().score()).vaut({ points: 0, maximum: 4, bonnes: 0, total: 3 });\n  });\n  test(\"cumule les points\", () => {\n    const q = neuf();\n    q.repondre(\"paris\");   // +1\n    q.repondre(\"4\");       // +2\n    q.repondre(\"faux\");    // +0\n    verifier(q.score()).vaut({ points: 3, maximum: 4, bonnes: 2, total: 3 });\n  });\n  test(\"sans faute\", () => {\n    const q = neuf();\n    q.repondre(\"paris\"); q.repondre(\"4\"); q.repondre(\"object\");\n    verifier(q.score().points).vaut(4);\n    verifier(q.score().bonnes).vaut(3);\n  });\n});\n\ngroupe(\"termine et progression\", () => {\n  test(\"termine passe à true à la fin\", () => {\n    const q = neuf();\n    verifier(q.termine()).estFaux();\n    q.repondre(\"a\"); q.repondre(\"b\");\n    verifier(q.termine()).estFaux();\n    q.repondre(\"c\");\n    verifier(q.termine()).estVrai();\n  });\n  test(\"progression\", () => {\n    const q = neuf();\n    verifier(q.progression()).vaut(\"0/3\");\n    q.repondre(\"paris\");\n    verifier(q.progression()).vaut(\"1/3\");\n    q.repondre(\"x\"); q.repondre(\"y\");\n    verifier(q.progression()).vaut(\"3/3\");\n  });\n});\n\ngroupe(\"bilan\", () => {\n  const jouer = reponses => {\n    const q = neuf();\n    for (const r of reponses) q.repondre(r);\n    return q.bilan();\n  };\n  test(\"parfait\", () => verifier(jouer([\"paris\", \"4\", \"object\"])).vaut(\"parfait\"));\n  test(\"très bien : 3 points sur 4\", () => verifier(jouer([\"paris\", \"4\", \"faux\"])).vaut(\"très bien\"));\n  test(\"correct : 2 points sur 4\", () => verifier(jouer([\"faux\", \"4\", \"faux\"])).vaut(\"correct\"));\n  test(\"à revoir : 1 point sur 4\", () => verifier(jouer([\"paris\", \"faux\", \"faux\"])).vaut(\"à revoir\"));\n  test(\"zéro\", () => verifier(jouer([\"a\", \"b\", \"c\"])).vaut(\"il faut relire la leçon\"));\n});\n\ngroupe(\"cas limite : quiz vide\", () => {\n  test(\"ne plante pas\", () => {\n    const q = creerQuiz([]);\n    verifier(() => q.bilan()).neLevePasDErreur(\"attention à la division par zéro\");\n    verifier(q.termine()).estVrai();\n    verifier(q.questionCourante()).vaut(null);\n    verifier(q.score()).vaut({ points: 0, maximum: 0, bonnes: 0, total: 0 });\n    verifier(q.bilan()).vaut(\"il faut relire la leçon\");\n  });\n});\n\ngroupe(\"isolement\", () => {\n  test(\"deux quiz sont indépendants\", () => {\n    const a = neuf(), b = neuf();\n    a.repondre(\"paris\"); a.repondre(\"4\");\n    verifier(b.score().points).vaut(0, \"chaque quiz doit avoir son propre état\");\n    verifier(b.progression()).vaut(\"0/3\");\n  });\n});\n","solution":"export function creerQuiz(questions) {\n  let index = 0;\n  let points = 0;\n  let bonnes = 0;\n\n  const maximum = questions.reduce((total, q) => total + q.points, 0);\n\n  const normaliser = valeur => String(valeur).trim().toLowerCase();\n\n  return {\n    questionCourante() {\n      return questions[index] ?? null;\n    },\n\n    repondre(saisie) {\n      const question = questions[index];\n      if (!question) return null;               // quiz déjà terminé\n\n      const correct = normaliser(saisie) === normaliser(question.reponse);\n      const gagnes = correct ? question.points : 0;\n\n      if (correct) {\n        points += gagnes;\n        bonnes++;\n      }\n      index++;\n\n      return { correct, attendu: question.reponse, points: gagnes };\n    },\n\n    score() {\n      return { points, maximum, bonnes, total: questions.length };\n    },\n\n    termine() {\n      return index >= questions.length;\n    },\n\n    bilan() {\n      if (maximum === 0) return \"il faut relire la leçon\";   // évite la division par zéro\n      const pct = (points / maximum) * 100;\n      if (pct === 100) return \"parfait\";\n      if (pct >= 75) return \"très bien\";\n      if (pct >= 50) return \"correct\";\n      if (pct >= 25) return \"à revoir\";\n      return \"il faut relire la leçon\";\n    },\n\n    progression() {\n      return `${index}/${questions.length}`;\n    }\n  };\n}"}]},{"num":"03","titre":"Fonctions","intro":"Découper, nommer, réutiliser. Et les concepts qui font la différence en entretien.","modules":[{"code":"03-01","titre":"Déclarer et appeler","min":30,"pret":false,"lecon":null},{"code":"03-02","titre":"Fonctions fléchées","min":30,"pret":false,"lecon":null},{"code":"03-03","titre":"Portée et hoisting","min":45,"pret":false,"lecon":null},{"code":"03-04","titre":"Paramètres avancés","min":30,"pret":false,"lecon":null},{"code":"03-05","titre":"Fonctions d'ordre supérieur","min":45,"pret":false,"lecon":null},{"code":"03-06","titre":"Closures","min":60,"pret":false,"lecon":null},{"code":"03-07","titre":"Récursivité","min":45,"pret":false,"lecon":null}]},{"num":"04","titre":"Tableaux et objets","intro":"Les deux structures que tu manipuleras 100 fois par jour. Et le piège de la référence.","modules":[{"code":"04-01","titre":"Tableaux : les bases","min":45,"pret":false,"lecon":null},{"code":"04-02","titre":"Objets : les bases","min":45,"pret":false,"lecon":null},{"code":"04-03","titre":"Parcourir un objet","min":30,"pret":false,"lecon":null},{"code":"04-04","titre":"Référence contre copie","min":45,"pret":false,"lecon":null},{"code":"04-05","titre":"Destructuring","min":45,"pret":false,"lecon":null},{"code":"04-06","titre":"Spread et rest","min":30,"pret":false,"lecon":null},{"code":"04-07","titre":"this et méthodes d'objet","min":45,"pret":false,"lecon":null},{"code":"04-08","titre":"Map et Set","min":30,"pret":false,"lecon":null},{"code":"04-09","titre":"JSON","min":30,"pret":false,"lecon":null}]},{"num":"05","titre":"Méthodes de tableaux modernes","intro":"map, filter, reduce. C'est ici que ton code commence à ressembler à du JS professionnel.","modules":[{"code":"05-01","titre":"forEach","min":15,"pret":false,"lecon":null},{"code":"05-02","titre":"map","min":45,"pret":false,"lecon":null},{"code":"05-03","titre":"filter","min":30,"pret":false,"lecon":null},{"code":"05-04","titre":"reduce","min":60,"pret":false,"lecon":null},{"code":"05-05","titre":"find, some, every","min":30,"pret":false,"lecon":null},{"code":"05-06","titre":"sort","min":45,"pret":false,"lecon":null},{"code":"05-07","titre":"Chaîner les méthodes","min":45,"pret":false,"lecon":null},{"code":"05-08","titre":"Projet : tableau de bord de données","min":120,"pret":false,"lecon":null}]},{"num":"06","titre":"Le DOM","intro":"Faire bouger une page. Le premier moment où ton code devient visible.","modules":[{"code":"06-01","titre":"Comprendre le DOM","min":30,"pret":false,"lecon":null},{"code":"06-02","titre":"Sélectionner des éléments","min":30,"pret":false,"lecon":null},{"code":"06-03","titre":"Modifier contenu et style","min":45,"pret":false,"lecon":null},{"code":"06-04","titre":"Créer et supprimer des éléments","min":45,"pret":false,"lecon":null},{"code":"06-05","titre":"Événements","min":60,"pret":false,"lecon":null},{"code":"06-06","titre":"Formulaires","min":60,"pret":false,"lecon":null},{"code":"06-07","titre":"Projet : liste de tâches","min":240,"pret":false,"lecon":null}]},{"num":"07","titre":"JavaScript moderne","intro":"Les briques que React suppose déjà acquises.","modules":[{"code":"07-01","titre":"Modules ES","min":45,"pret":false,"lecon":null},{"code":"07-02","titre":"Chaînage optionnel et nullish","min":30,"pret":false,"lecon":null},{"code":"07-03","titre":"Classes","min":60,"pret":false,"lecon":null},{"code":"07-04","titre":"Prototypes","min":45,"pret":false,"lecon":null},{"code":"07-05","titre":"Immutabilité en pratique","min":45,"pret":false,"lecon":null},{"code":"07-06","titre":"npm et package.json","min":45,"pret":false,"lecon":null},{"code":"07-07","titre":"Vite","min":45,"pret":false,"lecon":null}]},{"num":"08","titre":"Asynchrone","intro":"Attendre sans bloquer. Le chapitre qui sépare les débutants des juniors.","modules":[{"code":"08-01","titre":"Synchrone contre asynchrone","min":30,"pret":false,"lecon":null},{"code":"08-02","titre":"Callbacks","min":30,"pret":false,"lecon":null},{"code":"08-03","titre":"Promesses","min":60,"pret":false,"lecon":null},{"code":"08-04","titre":"async / await","min":60,"pret":false,"lecon":null},{"code":"08-05","titre":"fetch et les API","min":60,"pret":false,"lecon":null},{"code":"08-06","titre":"Chargement et erreurs","min":60,"pret":false,"lecon":null},{"code":"08-07","titre":"Promise.all et compagnie","min":45,"pret":false,"lecon":null},{"code":"08-08","titre":"POST, PUT, DELETE","min":45,"pret":false,"lecon":null},{"code":"08-09","titre":"Projet : app connectée à une API","min":240,"pret":false,"lecon":null}]},{"num":"09","titre":"Qualité et derniers réflexes","intro":"Déboguer, tester, écrire lisible. Puis le feu vert pour React.","modules":[{"code":"09-01","titre":"Débogage au debugger","min":45,"pret":false,"lecon":null},{"code":"09-02","titre":"Gestion des erreurs","min":30,"pret":false,"lecon":null},{"code":"09-03","titre":"Écrire du code lisible","min":45,"pret":false,"lecon":null},{"code":"09-04","titre":"Premiers tests","min":60,"pret":false,"lecon":null},{"code":"09-05","titre":"Relecture générale","min":120,"pret":false,"lecon":null},{"code":"09-06","titre":"Feu vert pour React","min":15,"pret":false,"lecon":null}]}],"verif":"// Mini-framework de test, zéro dépendance.\n// Les fichiers tests.mjs de chaque exercice l'utilisent.\n\nconst cas = [];\nlet groupeCourant = null;\n\n/** Regroupe des tests sous un titre. */\nexport function groupe(titre, fn) {\n  const prec = groupeCourant;\n  groupeCourant = titre;\n  fn();\n  groupeCourant = prec;\n}\n\n/** Déclare un test. `fn` peut être asynchrone. */\nexport function test(titre, fn) {\n  cas.push({ titre, fn, groupe: groupeCourant });\n}\n\nclass EchecAssertion extends Error {\n  constructor(message, attendu, obtenu) {\n    super(message);\n    this.name = \"EchecAssertion\";\n    this.attendu = attendu;\n    this.obtenu = obtenu;\n    this.aDetail = arguments.length > 1;\n  }\n}\n\nconst rendre = v => {\n  if (typeof v === \"string\") return JSON.stringify(v);\n  if (typeof v === \"function\") return \"[fonction \" + (v.name || \"anonyme\") + \"]\";\n  if (v === undefined) return \"undefined\";\n  if (typeof v === \"bigint\") return v + \"n\";\n  if (v instanceof Map) return \"Map(\" + JSON.stringify([...v.entries()]) + \")\";\n  if (v instanceof Set) return \"Set(\" + JSON.stringify([...v]) + \")\";\n  try { return JSON.stringify(v); } catch { return String(v); }\n};\n\nconst memeValeur = (a, b) => {\n  if (Object.is(a, b)) return true;\n  if (typeof a !== typeof b) return false;\n  if (a === null || b === null || typeof a !== \"object\") return false;\n  if (Array.isArray(a) !== Array.isArray(b)) return false;\n  const ca = Object.keys(a), cb = Object.keys(b);\n  if (ca.length !== cb.length) return false;\n  return ca.every(k => cb.includes(k) && memeValeur(a[k], b[k]));\n};\n\nexport function verifier(obtenu) {\n  return {\n    /** Égalité stricte, ou structurelle pour objets et tableaux. */\n    vaut(attendu, note) {\n      if (!memeValeur(obtenu, attendu))\n        throw new EchecAssertion(note || \"valeur incorrecte\", rendre(attendu), rendre(obtenu));\n      return this;\n    },\n    estVrai(note) {\n      if (obtenu !== true) throw new EchecAssertion(note || \"devrait valoir true\", \"true\", rendre(obtenu));\n      return this;\n    },\n    estFaux(note) {\n      if (obtenu !== false) throw new EchecAssertion(note || \"devrait valoir false\", \"false\", rendre(obtenu));\n      return this;\n    },\n    estDuType(t, note) {\n      if (typeof obtenu !== t)\n        throw new EchecAssertion(note || \"mauvais type\", \"typeof === \" + JSON.stringify(t), \"typeof === \" + JSON.stringify(typeof obtenu));\n      return this;\n    },\n    estUneFonction(note) {\n      if (typeof obtenu !== \"function\")\n        throw new EchecAssertion(note || \"une fonction est attendue ici\", \"une fonction\", rendre(obtenu));\n      return this;\n    },\n    contient(morceau, note) {\n      const ok = typeof obtenu === \"string\"\n        ? obtenu.includes(morceau)\n        : Array.isArray(obtenu) && obtenu.some(x => memeValeur(x, morceau));\n      if (!ok) throw new EchecAssertion(note || \"élément absent\", \"contient \" + rendre(morceau), rendre(obtenu));\n      return this;\n    },\n    aPourLongueur(n, note) {\n      const l = obtenu?.length;\n      if (l !== n) throw new EchecAssertion(note || \"mauvaise longueur\", \"longueur \" + n, \"longueur \" + rendre(l));\n      return this;\n    },\n    /** Vérifie qu'appeler la fonction lève une erreur. */\n    leveUneErreur(note) {\n      let leve = false;\n      try { obtenu(); } catch { leve = true; }\n      if (!leve) throw new EchecAssertion(note || \"une erreur était attendue\", \"une erreur levée\", \"aucune erreur\");\n      return this;\n    },\n    /** Vérifie qu'appeler la fonction ne lève PAS d'erreur. */\n    neLevePasDErreur(note) {\n      try { obtenu(); } catch (e) {\n        throw new EchecAssertion(note || \"ne devrait pas planter\", \"aucune erreur\", e.name + \" : \" + e.message);\n      }\n      return this;\n    },\n    /** Nombre à tolérance, pour les calculs flottants. */\n    vautEnviron(attendu, tolerance = 0.001, note) {\n      if (typeof obtenu !== \"number\" || Math.abs(obtenu - attendu) > tolerance)\n        throw new EchecAssertion(note || \"valeur numérique incorrecte\", \"≈ \" + attendu, rendre(obtenu));\n      return this;\n    }\n  };\n}\n\n/** Levée explicite depuis un test. */\nexport function echouer(message) {\n  throw new EchecAssertion(message);\n}\n\n/** Exécute tous les tests déclarés. Renvoie { total, reussis, echecs: [...] } */\nexport async function executer() {\n  const echecs = [];\n  let reussis = 0;\n  for (const c of cas) {\n    try {\n      await c.fn();\n      reussis++;\n      c.ok = true;\n    } catch (e) {\n      c.ok = false;\n      c.erreur = e;\n      echecs.push(c);\n    }\n  }\n  return { total: cas.length, reussis, echecs, cas };\n}\n\nexport { cas as _cas };\n"}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("donnees").textContent);
const CLE = "formation-js-v1";

/* =========================================================
   1. ÉTAT
   ========================================================= */
const vide = () => ({ version:1, creeLe:new Date().toISOString(), modules:{}, journal:[], code:{} });
let etat = vide();
try {
  const brut = localStorage.getItem(CLE);
  if (brut) { const p = JSON.parse(brut); etat = Object.assign(vide(), p);
    etat.modules ||= {}; etat.journal ||= []; etat.code ||= {}; }
} catch (e) { console.warn("état illisible, remise à zéro", e); }

const MODULES = DATA.sections.flatMap(s => s.modules.filter(m => m.pret));
const parCode = Object.fromEntries(MODULES.map(m => [m.code, m]));
const etatDe = c => etat.modules[c] || { etat:"a-faire", essais:0, echecs:0 };
const estFait = c => etatDe(c).etat === "reussi";

/** Index du premier module non réussi : seul lui et les précédents sont ouverts. */
function frontiere() {
  const i = MODULES.findIndex(m => !estFait(m.code));
  return i === -1 ? MODULES.length - 1 : i;
}
const estOuvert = code => MODULES.findIndex(m => m.code === code) <= frontiere();

function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); }
  catch (e) { console.warn("sauvegarde impossible", e); }
  syncProgression();
}

/** Reproduit exactement la logique de moteur/progression.mjs. */
function enregistrer(code, resultat, detail = {}) {
  const now = new Date().toISOString();
  const m = etat.modules[code] || { etat:"a-faire", essais:0, echecs:0,
    premierEssai:null, reussiLe:null, dernierEssai:null };
  m.essais++;
  m.premierEssai ||= now;
  m.dernierEssai = now;
  if (resultat === "reussi") {
    if (m.etat !== "reussi") m.reussiLe = now;
    m.etat = "reussi";
    m.essaisJusquAuSucces ??= m.essais;
  } else { m.echecs++; m.etat = "en-cours"; }
  etat.modules[code] = m;
  etat.journal.push(Object.assign({ date:now, code, action:resultat, source:"web" }, detail));
  if (etat.journal.length > 2000) etat.journal = etat.journal.slice(-2000);
  sauver();
  return m;
}
function validerManuellement(code) {
  const now = new Date().toISOString();
  const m = etat.modules[code] || { etat:"a-faire", essais:0, echecs:0 };
  m.etat = "reussi"; m.reussiLe = now; m.valideALaMain = true;
  etat.modules[code] = m;
  etat.journal.push({ date:now, code, action:"valide-main", source:"web" });
  sauver();
}

/* =========================================================
   2. COLORATION SYNTAXIQUE + MARKDOWN
   ========================================================= */
const ech = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW = new Set(("const let var function return if else for of in while do switch case default "+
  "break continue new typeof instanceof null undefined true false this class extends super try "+
  "catch finally throw async await export import from yield delete void NaN Infinity").split(" "));

function surligner(src) {
  let out = "", i = 0; const n = src.length;
  const est = (c,re) => c !== undefined && re.test(c);
  while (i < n) {
    const c = src[i], d = src[i+1];
    if (c === "/" && d === "/") { let j = src.indexOf("\n", i); if (j < 0) j = n;
      out += '<span class="j-com">'+ech(src.slice(i,j))+"</span>"; i = j; continue; }
    if (c === "/" && d === "*") { let j = src.indexOf("*/", i); j = j < 0 ? n : j+2;
      out += '<span class="j-com">'+ech(src.slice(i,j))+"</span>"; i = j; continue; }
    if (c === '"' || c === "'" || c === "`") {
      let j = i+1;
      while (j < n) { if (src[j] === "\\") { j += 2; continue; }
        if (src[j] === c) { j++; break; }
        if (c !== "`" && src[j] === "\n") break;
        j++; }
      out += '<span class="j-str">'+ech(src.slice(i,j))+"</span>"; i = j; continue;
    }
    if (est(c,/[0-9]/) && !est(src[i-1],/[\w$]/)) {
      let j = i; while (j < n && /[0-9a-fA-FxXeE._+\-]/.test(src[j]) &&
        !(/[+\-]/.test(src[j]) && !/[eE]/.test(src[j-1]))) j++;
      out += '<span class="j-num">'+ech(src.slice(i,j))+"</span>"; i = j; continue;
    }
    if (est(c,/[A-Za-z_$]/)) {
      let j = i; while (j < n && /[\w$]/.test(src[j])) j++;
      const mot = src.slice(i,j);
      let k = j; while (k < n && /\s/.test(src[k])) k++;
      const cls = KW.has(mot) ? "j-kw" : (src[k] === "(" ? "j-fn" : null);
      out += cls ? '<span class="'+cls+'">'+ech(mot)+"</span>" : ech(mot);
      i = j; continue;
    }
    if (est(c,/[{}()\[\];,.:=+\-*/%<>!&|?~^]/)) {
      out += '<span class="j-pon">'+ech(c)+"</span>"; i++; continue;
    }
    out += ech(c); i++;
  }
  return out;
}

function enligne(t) {
  return t
    .replace(/`([^`]+)`/g, (m,c) => "<code>"+c+"</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(src) {
  if (!src) return "";
  const blocs = [];
  src = src.replace(/```(\w*)\r?\n([\s\S]*?)```/g, (m, lang, code) => {
    blocs.push('<pre><code>'+surligner(code.replace(/\n$/,""))+"</code></pre>");
    return "␀B"+(blocs.length-1)+"␀";
  });
  const lignes = ech(src).split(/\r?\n/);
  const html = []; let i = 0;
  while (i < lignes.length) {
    let L = lignes[i];
    if (/^␀B\d+␀$/.test(L.trim())) { html.push(L.trim()); i++; continue; }
    if (!L.trim()) { i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(L)) { html.push("<hr>"); i++; continue; }
    let h = L.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = h[1].length; html.push("<h"+n+">"+enligne(h[2])+"</h"+n+">"); i++; continue; }
    if (/^\s*>\s?/.test(L)) {
      const buf = [];
      while (i < lignes.length && /^\s*>\s?/.test(lignes[i])) { buf.push(lignes[i].replace(/^\s*>\s?/,"")); i++; }
      html.push("<blockquote>"+enligne(buf.join(" "))+"</blockquote>"); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(L) && i+1 < lignes.length && /^\s*\|[\s:|-]+\|\s*$/.test(lignes[i+1])) {
      const cell = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c => enligne(c.trim()));
      const tete = cell(lignes[i]); i += 2;
      const corps = [];
      while (i < lignes.length && /^\s*\|.*\|\s*$/.test(lignes[i])) { corps.push(cell(lignes[i])); i++; }
      html.push("<table><thead><tr>"+tete.map(c => "<th>"+c+"</th>").join("")+
        "</tr></thead><tbody>"+corps.map(r => "<tr>"+r.map(c => "<td>"+c+"</td>").join("")+"</tr>").join("")+
        "</tbody></table>");
      continue;
    }
    const puce = /^\s*[-*+]\s+/, num = /^\s*\d+[.)]\s+/;
    if (puce.test(L) || num.test(L)) {
      const ord = num.test(L), re = ord ? num : puce, buf = [];
      while (i < lignes.length && re.test(lignes[i])) {
        let t = lignes[i].replace(re,""); i++;
        while (i < lignes.length && lignes[i].trim() && !re.test(lignes[i]) &&
               !/^(#{1,6}\s|\s*\||␀B)/.test(lignes[i])) { t += " "+lignes[i].trim(); i++; }
        buf.push("<li>"+enligne(t)+"</li>");
      }
      html.push((ord?"<ol>":"<ul>")+buf.join("")+(ord?"</ol>":"</ul>")); continue;
    }
    const buf = [];
    while (i < lignes.length && lignes[i].trim() && !/^(#{1,6}\s|\s*>|\s*[-*+]\s|\s*\d+[.)]\s|\s*\||␀B|-{3,}\s*$)/.test(lignes[i])) {
      buf.push(lignes[i]); i++;
    }
    if (buf.length) html.push("<p>"+enligne(buf.join(" "))+"</p>"); else i++;
  }
  return html.join("\n").replace(/␀B(\d+)␀/g, (m,n) => blocs[+n]);
}

/* =========================================================
   3. EXÉCUTION DU CODE (sans modules ES : compatible file://)
   ========================================================= */
/** Repère les positions hors chaînes/commentaires des mots-clés de boucle. */
function positionsBoucles(src) {
  const pos = []; let i = 0; const n = src.length;
  while (i < n) {
    const c = src[i], d = src[i+1];
    if (c === "/" && d === "/") { let j = src.indexOf("\n", i); i = j < 0 ? n : j; continue; }
    if (c === "/" && d === "*") { let j = src.indexOf("*/", i); i = j < 0 ? n : j+2; continue; }
    if (c === '"' || c === "'" || c === "`") {
      let j = i+1;
      while (j < n) { if (src[j] === "\\") { j += 2; continue; } if (src[j] === c) { j++; break; } j++; }
      i = j; continue;
    }
    if (/[A-Za-z_$]/.test(c)) {
      let j = i; while (j < n && /[\w$]/.test(src[j])) j++;
      const mot = src.slice(i,j);
      if ((mot === "for" || mot === "while" || mot === "do") && src[i-1] !== ".") pos.push({ mot, i, j });
      i = j; continue;
    }
    i++;
  }
  return pos;
}
function finParenthese(src, ouvre) {
  let p = 0, i = ouvre, n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '"' || c === "'" || c === "`") {
      let j = i+1;
      while (j < n) { if (src[j] === "\\") { j += 2; continue; } if (src[j] === c) { j++; break; } j++; }
      i = j; continue;
    }
    if (c === "(") p++;
    else if (c === ")") { p--; if (p === 0) return i+1; }
    i++;
  }
  return -1;
}
/** Injecte `__tick();` en tête de chaque corps de boucle → coupe les boucles infinies. */
function proteger(src) {
  try {
    const ins = [];
    for (const b of positionsBoucles(src)) {
      let k = b.j;
      if (b.mot === "do") {
        while (k < src.length && /\s/.test(src[k])) k++;
        if (src[k] === "{") ins.push(k+1);
        continue;
      }
      while (k < src.length && /\s/.test(src[k])) k++;
      if (src[k] !== "(") continue;
      const f = finParenthese(src, k);
      if (f < 0) continue;
      let m = f;
      while (m < src.length && /\s/.test(src[m])) m++;
      if (src[m] === "{") ins.push(m+1);
    }
    let out = src;
    ins.sort((a,b) => b-a).forEach(p => { out = out.slice(0,p) + "__tick();" + out.slice(p); });
    return out;
  } catch (e) { return src; }
}

let _debut = 0;
function __tick() {
  if (Date.now() - _debut > 3000) { const e = new Error("BOUCLE_TROP_LONGUE"); e.boucle = true; throw e; }
}

function transformerExercice(src) {
  const noms = [];
  const add = n => { if (n && !noms.includes(n)) noms.push(n); };
  src.replace(/\bexport\s+(?:async\s+)?function\s*\*?\s*([A-Za-z_$][\w$]*)/g, (m,n) => (add(n), m));
  src.replace(/\bexport\s+(?:const|let|var)\s+([A-Za-z_$][\w$]*)/g, (m,n) => (add(n), m));
  src.replace(/\bexport\s+class\s+([A-Za-z_$][\w$]*)/g, (m,n) => (add(n), m));
  src.replace(/^[ \t]*export\s*\{([^}]*)\}/gm, (m,inner) => {
    inner.split(",").forEach(p => { const t = p.split(/\s+as\s+/); add((t[0]||"").trim()); });
    return m;
  });
  let code = src
    .replace(/^[ \t]*export\s*\{[^}]*\}[ \t]*;?[ \t]*$/gm, "")
    .replace(/^([ \t]*)export\s+(?=(?:async\s+)?(?:function|const|let|var|class)\b)/gm, "$1");
  return { code, noms };
}
function transformerTests(src) {
  return src
    .replace(/^[ \t]*import\s+[^;\n]*?from\s+["'][^"']*verif\.mjs["'][ \t]*;?[ \t]*$/gm, "")
    .replace(/^[ \t]*import\s+\*\s+as\s+([A-Za-z_$][\w$]*)\s+from\s+["']\.\/exercice\.mjs["'][ \t]*;?[ \t]*$/gm, "const $1 = __ex;")
    .replace(/^[ \t]*import\s+\{([^}]*)\}\s+from\s+["']\.\/exercice\.mjs["'][ \t]*;?[ \t]*$/gm, "const {$1} = __ex;");
}
/** Instancie une copie neuve du mini-framework de test du moteur. */
function creerVerif() {
  const { code, noms } = transformerExercice(DATA.verif);
  return new Function(code + "\n;return {" + noms.join(",") + "};")();
}

async function lancerTests(mod, source) {
  const sortie = [];
  const fmt = v => {
    if (typeof v === "string") return v;
    if (v === undefined) return "undefined";
    try { return JSON.stringify(v); } catch { return String(v); }
  };
  const faux = {};
  ["log","info","warn","error","debug"].forEach(k => faux[k] = (...a) => sortie.push(a.map(fmt).join(" ")));
  faux.table = faux.log; faux.dir = faux.log;

  _debut = Date.now();
  let ex;
  try {
    const { code, noms } = transformerExercice(source);
    if (!noms.length) return { fatale:"Aucune fonction exportée trouvée. Garde bien les mots-clés `export` du fichier de départ.", sortie };
    const fab = new Function("console","__tick", proteger(code) + "\n;return {" + noms.join(",") + "};");
    ex = fab(faux, __tick);
  } catch (e) {
    return { fatale: (e && e.boucle) ? "Boucle qui ne s'arrête jamais : ta condition ne devient jamais fausse."
      : "Ton fichier ne s'exécute pas — " + (e.name || "Erreur") + " : " + e.message, sortie };
  }

  const v = creerVerif();
  try {
    new Function("test","groupe","verifier","echouer","__ex","console", transformerTests(mod.tests))
      (v.test, v.groupe, v.verifier, v.echouer, ex, faux);
  } catch (e) {
    return { fatale:"Erreur au chargement des tests : " + e.message, sortie };
  }

  _debut = Date.now();
  let r;
  try { r = await v.executer(); }
  catch (e) { return { fatale:"Exécution interrompue : " + e.message, sortie }; }
  return { r, sortie };
}

/* =========================================================
   4. SYNCHRONISATION AVEC LE DOSSIER (optionnelle)
   ========================================================= */
let racine = null;
const idb = {
  ouvrir: () => new Promise((ok,ko) => {
    const q = indexedDB.open("formation-js", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("h");
    q.onsuccess = () => ok(q.result); q.onerror = () => ko(q.error);
  }),
  async set(k,v){ const d = await this.ouvrir(); return new Promise(ok => {
    const t = d.transaction("h","readwrite"); t.objectStore("h").put(v,k); t.oncomplete = ok; }); },
  async get(k){ const d = await this.ouvrir(); return new Promise(ok => {
    const t = d.transaction("h","readonly"); const q = t.objectStore("h").get(k);
    q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); }
};
const supporteFS = typeof window.showDirectoryPicker === "function";

async function ecrireFichier(parts, contenu) {
  if (!racine) return false;
  try {
    let d = racine;
    for (const p of parts.slice(0,-1)) d = await d.getDirectoryHandle(p, { create:true });
    const f = await d.getFileHandle(parts[parts.length-1], { create:true });
    const w = await f.createWritable();
    await w.write(contenu); await w.close();
    return true;
  } catch (e) { console.warn("écriture impossible", parts, e); return false; }
}
function progressionJson() {
  const p = { version:1, creeLe: etat.creeLe, modules: etat.modules, journal: etat.journal };
  return JSON.stringify(p, null, 2) + "\n";
}
let tSync = null;
function syncProgression() {
  if (!racine) return;
  clearTimeout(tSync);
  tSync = setTimeout(() => ecrireFichier(["progression.json"], progressionJson()), 400);
}
function syncCode(code) {
  const mod = parCode[code];
  if (!racine || !mod || !mod.dossier) return;
  ecrireFichier(["exercices", mod.dossier, "exercice.mjs"], etat.code[code] ?? mod.depart);
}
async function connecter() {
  if (!supporteFS) { modale("Non disponible",
    "<p>Ton navigateur ne permet pas d'écrire directement dans un dossier. Utilise <b>Chrome</b> ou <b>Edge</b>, "+
    "ou reste en mode navigateur et clique sur <b>Exporter progression.json</b> de temps en temps.</p>"); return; }
  try {
    racine = await window.showDirectoryPicker({ mode:"readwrite" });
    await idb.set("racine", racine);
    await apresConnexion();
  } catch (e) { if (e && e.name !== "AbortError") modale("Échec", "<p>"+ech(String(e.message||e))+"</p>"); }
}
async function apresConnexion() {
  // récupère un éventuel travail fait en ligne de commande
  try {
    const f = await racine.getFileHandle("progression.json");
    const dist = JSON.parse(await (await f.getFile()).text());
    if (dist && dist.modules) {
      for (const [c,m] of Object.entries(dist.modules)) {
        const loc = etat.modules[c];
        if (!loc || (m.etat === "reussi" && loc.etat !== "reussi")) etat.modules[c] = m;
      }
      if ((dist.journal||[]).length > etat.journal.length) etat.journal = dist.journal;
      etat.creeLe = dist.creeLe || etat.creeLe;
    }
  } catch (e) { /* fichier absent ou illisible : on garde l'état local */ }
  for (const m of MODULES) if (m.dossier && etat.code[m.code]) await syncCode(m.code);
  await ecrireFichier(["progression.json"], progressionJson());
  majSync(); sauver(); dessiner();
}
function majSync() {
  const el = document.getElementById("etat-sync");
  el.innerHTML = racine
    ? "Synchronisé avec <b>" + ech(racine.name) + "</b>"
    : "Progression enregistrée dans ce navigateur";
  document.getElementById("b-connecter").style.display = racine ? "none" : "";
}
(async () => {
  if (!supporteFS) { document.getElementById("b-connecter").style.display = "none"; return; }
  try {
    const h = await idb.get("racine");
    if (h && (await h.queryPermission({ mode:"readwrite" })) === "granted") { racine = h; await apresConnexion(); }
  } catch (e) {}
})();

let courant = null, onglet = "lecon", editeur = null, dernierRes = null;

function dessinerLat() {
  const f = frontiere();
  const l = document.getElementById("liste");
  l.innerHTML = DATA.sections.map(s => {
    const mods = s.modules.filter(m => m.pret);
    if (!mods.length) return "";
    return '<div class="sec">' + s.num + " · " + ech(s.titre) + "</div>" +
      mods.map(m => {
        const e = etatDe(m.code), idx = MODULES.findIndex(x => x.code === m.code);
        const cls = ["mod"];
        if (e.etat === "reussi") cls.push("fait");
        else if (e.etat === "en-cours") cls.push("encours");
        if (idx > f) cls.push("bloque");
        if (courant === m.code) cls.push("actif");
        const p = e.etat === "reussi" ? "●" : (idx > f ? "🔒" : (e.etat === "en-cours" ? "◐" : "○"));
        return '<div class="'+cls.join(" ")+'" data-code="'+m.code+'">'+
          '<span class="pastille">'+p+'</span>'+
          '<span class="code">'+m.code+'</span>'+
          '<span class="nom">'+ech(m.titre)+"</span></div>";
      }).join("");
  }).join("");
  const faits = MODULES.filter(m => estFait(m.code)).length;
  const pc = Math.round(faits / MODULES.length * 100);
  document.getElementById("jauge").style.width = pc + "%";
  document.getElementById("jauge-txt").textContent = faits + " / " + MODULES.length + " modules";
  document.getElementById("jauge-pc").textContent = pc + " %";
}

function dessiner() {
  dessinerLat();
  const ent = document.getElementById("entete"), vue = document.getElementById("vue");
  if (!courant) { ent.innerHTML = ""; vue.innerHTML = accueil(); brancherAccueil(); return; }
  const m = parCode[courant], e = etatDe(courant);
  const ongs = [["lecon","Leçon"]];
  if (m.dossier) ongs.push(["exo","Exercice"]);
  if (m.dossier && e.etat === "reussi") ongs.push(["sol","Solution de référence"]);
  if (!ongs.some(o => o[0] === onglet)) onglet = ongs[0][0];
  ent.innerHTML =
    '<div class="ligne"><h2>'+ech(m.titre)+"</h2>"+
    '<span class="meta">'+m.code+" · "+m.min+" min</span>"+
    (e.etat === "reussi" ? '<span class="badge ok">réussi</span>' :
     e.etat === "en-cours" ? '<span class="badge">'+e.essais+" tentative"+(e.essais>1?"s":"")+"</span>" : "")+
    "</div><div class=\"onglets\">"+
    ongs.map(o => '<button class="onglet'+(onglet===o[0]?" actif":"")+'" data-ong="'+o[0]+'">'+o[1]+"</button>").join("")+
    "</div>";
  ent.querySelectorAll("[data-ong]").forEach(b =>
    b.onclick = () => { onglet = b.dataset.ong; dessiner(); });

  if (onglet === "lecon") vue.innerHTML = '<div class="doc">'+md(m.lecon)+ (m.dossier ? "" : boutonManuel(m,e)) +"</div>";
  else if (onglet === "sol") vue.innerHTML = '<div class="doc"><h1>Solution de référence</h1>'+
    "<p>Compare-la à la tienne. Les différences de style comptent autant que le résultat.</p>"+
    "<pre><code>"+surligner(m.solution||"")+"</code></pre></div>";
  else dessinerExo(m);

  if (onglet === "lecon" && !m.dossier) {
    const b = vue.querySelector("#b-manuel");
    if (b) b.onclick = () => { validerManuellement(m.code); suivant(); };
  }
}
function boutonManuel(m,e) {
  if (e.etat === "reussi") return '<div class="reussite"><b>✓</b><p>Module validé. '+
    '<button class="btn sec" id="b-manuel">Revalider</button></p></div>';
  return '<hr><p>Ce module n\'a pas de tests automatiques : il se valide à la main quand tu l\'as fait.</p>'+
    '<p><button class="btn" id="b-manuel">J\'ai terminé ce module</button></p>';
}

function dessinerExo(m) {
  const vue = document.getElementById("vue");
  vue.innerHTML =
    '<div class="split"><div class="gauche"><div class="doc">'+md(m.enonce)+"</div></div>"+
    '<div class="droite">'+
      '<div class="barre"><span class="fic">exercices/'+m.dossier+"/exercice.mjs</span>"+
        '<button class="btn sec" id="b-reset">Repartir de zéro</button>'+
        '<button class="btn" id="b-run">▶ Lancer les tests <kbd>Ctrl+↵</kbd></button></div>'+
      '<div class="ed" id="ed"><div class="cadre">'+
        '<div class="gout" id="gout"></div>'+
        '<div class="zone"><pre><code id="hl"></code></pre>'+
        '<textarea id="ta" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea></div>'+
      "</div></div>"+
      '<div class="res" id="res"><div class="vide">Écris ton code, puis lance les tests.</div></div>'+
    "</div></div>";
  editeur = monterEditeur(etat.code[m.code] ?? m.depart, () => {
    etat.code[m.code] = editeur.valeur();
    try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {}
  });
  document.getElementById("b-run").onclick = executer;
  document.getElementById("b-reset").onclick = () => {
    if (!confirm("Remplacer ton code par le fichier de départ ?")) return;
    editeur.definir(m.depart); etat.code[m.code] = m.depart; sauver(); syncCode(m.code);
  };
  if (dernierRes && dernierRes.code === m.code) afficherRes(dernierRes.data);
}

function monterEditeur(valeur, onchange) {
  const ta = document.getElementById("ta"), hl = document.getElementById("hl"),
        gout = document.getElementById("gout"), ed = document.getElementById("ed");
  let t = null;
  function peindre() {
    const v = ta.value;
    hl.innerHTML = surligner(v) + "\n";
    const n = v.split("\n").length;
    gout.innerHTML = Array.from({length:n}, (_,i) => i+1).join("<br>");
    ta.style.height = "auto";
    const h = Math.max(hl.parentElement.scrollHeight, ed.clientHeight - 1, 200);
    ta.style.height = h + "px";
    hl.parentElement.style.height = h + "px";
  }
  ta.value = valeur;
  peindre();
  ta.addEventListener("input", () => { peindre(); clearTimeout(t); t = setTimeout(onchange, 350); });
  ta.addEventListener("keydown", ev => {
    if (ev.key === "Tab") {
      ev.preventDefault();
      const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
      if (s !== e && v.slice(s,e).includes("\n")) {
        const d = v.lastIndexOf("\n", s-1)+1;
        const bloc = v.slice(d,e);
        const neuf = ev.shiftKey ? bloc.replace(/^ {1,2}/gm,"") : bloc.replace(/^/gm,"  ");
        ta.value = v.slice(0,d) + neuf + v.slice(e);
        ta.selectionStart = d; ta.selectionEnd = d + neuf.length;
      } else {
        ta.value = v.slice(0,s) + "  " + v.slice(e);
        ta.selectionStart = ta.selectionEnd = s + 2;
      }
      peindre(); clearTimeout(t); t = setTimeout(onchange, 350); return;
    }
    if (ev.key === "Enter") {
      const s = ta.selectionStart, v = ta.value;
      const d = v.lastIndexOf("\n", s-1)+1;
      const ind = (v.slice(d,s).match(/^[ \t]*/)||[""])[0];
      const sup = /[{[(]\s*$/.test(v.slice(d,s)) ? "  " : "";
      ev.preventDefault();
      const ins = "\n" + ind + sup;
      ta.value = v.slice(0,s) + ins + v.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = s + ins.length;
      peindre(); clearTimeout(t); t = setTimeout(onchange, 350); return;
    }
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") { ev.preventDefault(); executer(); }
  });
  window.addEventListener("resize", peindre);
  return { valeur: () => ta.value, definir: v => { ta.value = v; peindre(); }, focus: () => ta.focus() };
}

async function executer() {
  const m = parCode[courant];
  const b = document.getElementById("b-run");
  const res = document.getElementById("res");
  b.disabled = true; b.textContent = "…";
  res.innerHTML = '<div class="vide">Exécution…</div>';
  etat.code[m.code] = editeur.valeur();
  await new Promise(r => setTimeout(r, 20));
  let data;
  try { data = await lancerTests(m, editeur.valeur()); }
  catch (e) { data = { fatale:"Erreur inattendue : " + e.message, sortie:[] }; }
  b.disabled = false; b.innerHTML = "▶ Lancer les tests <kbd>Ctrl+↵</kbd>";
  const reussi = !!(data.r && data.r.echecs.length === 0 && data.r.total > 0);
  enregistrer(m.code, reussi ? "reussi" : "echec",
    { total: data.r ? data.r.total : 0, reussis: data.r ? data.r.reussis : 0 });
  syncCode(m.code);
  dernierRes = { code:m.code, data };
  afficherRes(data);
  dessinerLat();
  if (reussi) {
    const e2 = document.getElementById("entete");
    if (e2 && !e2.querySelector(".badge.ok")) dessiner(), afficherRes(data);
  }
}

function afficherRes(data) {
  const res = document.getElementById("res");
  if (!res) return;
  const m = parCode[courant];
  let h = "";
  if (data.fatale) {
    h = '<div class="res-bar"><span class="pt ko">Le code n\'a pas pu s\'exécuter</span></div>'+
        '<div class="detail">'+ech(data.fatale)+"</div>";
  } else {
    const r = data.r, ok = r.echecs.length === 0;
    h = '<div class="res-bar"><span class="pt '+(ok?"ok":"ko")+'">'+
        r.reussis+" / "+r.total+" tests"+(ok?" ✓":"")+"</span>"+
        (ok ? "" : '<span style="color:var(--muet);font-size:12px">'+r.echecs.length+" à corriger</span>")+
        "</div>";
    if (ok) {
      const suiv = MODULES[MODULES.findIndex(x => x.code === m.code)+1];
      h += '<div class="reussite"><b>✓</b><p>Module <b>'+m.code+"</b> validé. "+
        "Regarde la solution de référence et compare-la à ton code.</p>"+
        (suiv ? '<button class="btn ok" id="b-suivant">Module suivant : '+suiv.code+"</button>" : "")+
        "</div>";
    }
    let grp = null;
    for (const c of r.cas) {
      if (c.groupe !== grp) { grp = c.groupe; if (grp) h += '<div class="res-grp">'+ech(grp)+"</div>"; }
      h += '<div class="res-cas '+(c.ok?"v":"x")+'"><span class="ic">'+(c.ok?"✓":"✕")+
           "</span><span>"+ech(c.titre)+"</span></div>";
      if (!c.ok && c.erreur) {
        const e = c.erreur;
        let d = ech(e.message || String(e));
        if (/BOUCLE_TROP_LONGUE/.test(d)) d = "Boucle qui ne s'arrête jamais : dans cette fonction, la condition "+
          "de ta boucle ne devient jamais fausse. Vérifie que la variable testée change bien à chaque tour.";
        if (e.aDetail) d += '\n<span class="lbl">attendu :</span> <span class="att">'+ech(String(e.attendu))+
          '</span>\n<span class="lbl">obtenu  :</span> <span class="obt">'+ech(String(e.obtenu))+"</span>";
        else if (e.name && e.name !== "EchecAssertion") d = ech(e.name) + " : " + d;
        h += '<div class="detail">'+d+"</div>";
      }
    }
  }
  if (data.sortie && data.sortie.length)
    h += '<pre class="sortie"><span class="t">Sortie console</span>'+ech(data.sortie.join("\n"))+"</pre>";
  res.innerHTML = h;
  const bs = document.getElementById("b-suivant");
  if (bs) bs.onclick = suivant;
}

function suivant() {
  const i = MODULES.findIndex(x => x.code === courant);
  const s = MODULES[i+1];
  if (s) ouvrir(s.code); else { courant = null; dessiner(); }
}
function ouvrir(code) {
  if (!estOuvert(code)) return;
  courant = code; onglet = estFait(code) && parCode[code].dossier ? "exo" : "lecon";
  if (!estFait(code)) onglet = "lecon";
  dessiner();
  location.hash = code;
}

/* accueil */
function accueil() {
  const faits = MODULES.filter(m => estFait(m.code)).length;
  const prochain = MODULES[frontiere()];
  const essais = Object.values(etat.modules).reduce((a,m) => a + (m.essais||0), 0);
  const min = MODULES.filter(m => estFait(m.code)).reduce((a,m) => a + m.min, 0);
  return '<div class="accueil"><h2>Bienvenue, Black</h2>'+
    '<p class="sous">Sections 01 et 02 · '+MODULES.length+' modules · 191 tests. Les sections 03 à 09 arrivent quand tu approches de la fin.</p>'+
    '<div class="cartes">'+
      '<div class="carte"><div class="gros">'+faits+" / "+MODULES.length+'</div><h3>Modules réussis</h3>'+
        "<p>"+Math.round(min/60*10)/10+" h de contenu validé</p></div>"+
      '<div class="carte"><div class="gros">'+essais+'</div><h3>Tentatives</h3>'+
        "<p>Les échecs comptent : c'est eux qui montrent où tu bloques</p></div>"+
      '<div class="carte"><h3>Prochain module</h3><p><b style="color:var(--accent)">'+prochain.code+" · "+ech(prochain.titre)+
        "</b><br>"+prochain.min+" min</p><p style=\"margin-top:10px\"><button class=\"btn\" id=\"b-go\">Commencer</button></p></div>"+
    "</div>"+
    '<div class="carte" style="margin-top:22px;max-width:920px"><h3>Le cycle, en 4 temps</h3>'+
      "<p>1. Lis la leçon &nbsp;·&nbsp; 2. Code dans l'éditeur &nbsp;·&nbsp; 3. <kbd>Ctrl</kbd>+<kbd>Entrée</kbd> pour lancer les tests "+
      "&nbsp;·&nbsp; 4. Corrige jusqu'au vert.<br>Les modules se débloquent dans l'ordre. Rien à installer, rien à taper dans un terminal.</p></div>"+
    "</div>";
}
function brancherAccueil() {
  const b = document.getElementById("b-go");
  if (b) b.onclick = () => ouvrir(MODULES[frontiere()].code);
}

/* modale */
function modale(titre, html) {
  document.getElementById("modale").innerHTML = "<h3>"+ech(titre)+'</h3><div class="doc">'+html+"</div>"+
    '<div class="fin"><button class="btn" id="b-fermer">Fermer</button></div>';
  document.getElementById("fond").classList.add("on");
  document.getElementById("b-fermer").onclick = () => document.getElementById("fond").classList.remove("on");
}
document.getElementById("fond").onclick = ev => {
  if (ev.target.id === "fond") ev.currentTarget.classList.remove("on");
};

/* =========================================================
   6. BRANCHEMENTS
   ========================================================= */
document.getElementById("liste").onclick = ev => {
  const d = ev.target.closest(".mod");
  if (!d) return;
  if (d.classList.contains("bloque")) {
    modale("Module verrouillé", "<p>L'ordre est strict : chaque module suppose le précédent acquis. "+
      "Termine <b>"+MODULES[frontiere()].code+"</b> pour débloquer celui-ci.</p>");
    return;
  }
  ouvrir(d.dataset.code);
};
document.getElementById("b-connecter").onclick = connecter;
document.getElementById("b-export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([progressionJson()], { type:"application/json" }));
  a.download = "progression.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
document.getElementById("b-aide").onclick = () => modale("Comment ça marche", md(
"## Le cycle\n\n"+
"1. Clique un module à gauche, lis la **Leçon**.\n"+
"2. Onglet **Exercice** : l'énoncé est à gauche, tu codes à droite.\n"+
"3. `Ctrl+Entrée` lance les tests. Le rouge te dit ce qui ne va pas, avec l'attendu et l'obtenu.\n"+
"4. Corrige jusqu'au vert. La solution de référence se débloque à ce moment-là.\n\n"+
"## Les règles\n\n"+
"- L'ordre est strict : un module se débloque quand le précédent est vert.\n"+
"- Un module dont les tests ne passent pas n'est pas fait.\n"+
"- Bloqué plus de 30 minutes ? Ouvre-moi une session : indice, pas réponse.\n"+
"- Ne passe pas à React avant la fin de la section 09.\n\n"+
"## Ton code est-il sauvegardé ?\n\n"+
"Oui, dans ce navigateur, à chaque frappe. Ne vide pas les données du site.\n\n"+
"**Pour que le bilan hebdomadaire lise ton vrai code**, clique **Connecter le dossier Javascript** et choisis le dossier "+
"`Desktop/Javascript`. L'app écrit alors directement dans `exercices/*/exercice.mjs` et `progression.json` — "+
"exactement les mêmes fichiers que la commande `js`. Les deux modes restent compatibles.\n\n"+
"## Raccourcis\n\n"+
"| Touche | Effet |\n|---|---|\n| `Ctrl+Entrée` | Lancer les tests |\n| `Tab` | Indenter |\n| `Shift+Tab` | Désindenter |\n"));

window.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter" && courant && onglet === "exo") {
    ev.preventDefault(); executer();
  }
  if (ev.key === "Escape") document.getElementById("fond").classList.remove("on");
});
window.addEventListener("beforeunload", () => {
  if (courant && editeur) { etat.code[courant] = editeur.valeur();
    try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} }
});

const h = location.hash.replace("#","");
if (h && parCode[h] && estOuvert(h)) ouvrir(h); else dessiner();
majSync();
</script>
